[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The kill switch for the Gatsby site's service worker: browsers must always fetch the latest.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# @astrojs/sitemap writes sitemap-index.xml; keep the old URL search engines know.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
