# Only the keys that differ from the plugin's defaults.

[commands]
# The gate /sdlc:ship runs: ESLint and Prettier, the first step CI runs.
check = "npm run lint"
# The slower check: astro check and the full static build Netlify runs. Run when a change touches
# anything Astro compiles, posts included, since a bad MDX file or a missing image fails only here.
build = "npm run build"
build_when = "^(src/|public/|blog/|scripts/|astro\\.config\\.mjs$|package(-lock)?\\.json$|netlify\\.toml$|tsconfig\\.json$)"
# A fresh worktree has no node_modules; install them from the lockfile, as CI does.
worktree_setup = "cd {worktree} && npm ci"

[docs]
# CLAUDE.md only imports AGENTS.md; the invariants live in AGENTS.md.
policy = "AGENTS.md"

[archive]
# Changes are tracked on GitHub: each one is numbered by its issue on faeldon/faeldon-website.
target = "github"

[git]
# The repo's branch is master, not main; pinned so a change to origin/HEAD never moves it.
base = "master"
